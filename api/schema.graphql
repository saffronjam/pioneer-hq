  pipeJunctionsChanged(sessionId: ID!): [PipeJunction!]! @auth
  cablesChanged(sessionId: ID!): [Cable!]! @auth
  trainRailsChanged(sessionId: ID!): [TrainRail!]! @auth
  hypertubesChanged(sessionId: ID!): [Hypertube!]! @auth
  hypertubeEntrancesChanged(sessionId: ID!): [HypertubeEntrance!]! @auth

  spaceElevatorChanged(sessionId: ID!): SpaceElevator! @auth
  hubChanged(sessionId: ID!): Hub! @auth
  radarTowersChanged(sessionId: ID!): [RadarTower!]! @auth
  resourceNodesChanged(sessionId: ID!): [ResourceNode!]! @auth
  schematicsChanged(sessionId: ID!): [Schematic!]! @auth
}

# Production planner

type PlannerAmount {
  itemId: ID!
  amount: Float!
}

type PlannerItem {
  unavailable: Boolean!
  id: ID!
  name: String!
  form: String!
  resource: Boolean!
  sinkable: Boolean!
}

type PlannerMachine {
  buildCost: [PlannerAmount!]!
  id: ID!
  name: String!
  power: Float!
  powerExponent: Float!
  boostPowerExponent: Float!
  boostSlots: Int!
  boostPerSlot: Float!
  variablePower: Boolean!
  minClock: Float!
  maxClock: Float!
}

type PlannerRecipe {
  unavailable: Boolean!
  id: ID!
  name: String!
  alternate: Boolean!
  duration: Float!
  machineIds: [String!]!
  ingredients: [PlannerAmount!]!
  products: [PlannerAmount!]!
  powerConstant: Float!
  powerFactor: Float!
}

type PlannerUnlock {
  recipeId: ID!
  unlocked: Boolean!
}

type PlannerCatalog {
  syncError: String!
  version: String!
  sourceHash: String!
