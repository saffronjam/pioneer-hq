# ============================================================================
# Sessions / config / status
# ============================================================================

enum SessionStage {
  INIT
  READY
}

enum LogLevel {
  TRACE
  DEBUG
  INFO
  WARNING
  ERROR
}

type Session {
  id: String!
  name: String!
  address: String!
  "The save this session is pinned to, fixed when the session is created."
  saveName: String!
  isPaused: Boolean!
  createdAt: DateTime!
  connectionState: ConnectionState!
  stage: SessionStage!
  offlineReason: ConnectivityReason!
  "The save the server has loaded instead. Non-null exactly when connectionState is SAVE_MISMATCH."
  mismatchedSaveName: String
}

"""
DiscoveredSession is an FRM server found by sweeping the network. info is the
same probe result the add-session form shows, so choosing one needs no second
round trip.
"""
type DiscoveredSession {
  address: String!
  info: SessionInfo!
  "True when a session already exists for this server, so the client can show it without offering it."
  alreadyAdded: Boolean!
}

type SessionInfo {
  saveName: String!
  isPaused: Boolean!
  dayLength: Int!
  nightLength: Int!
  passedDays: Int!
  numberOfDaysSinceLastDeath: Int!
  hours: Int!
  minutes: Int!
  seconds: Float!
  isDay: Boolean!
  totalPlayDuration: Int!
  totalPlayDurationText: String!
}

type Settings {
  logLevel: LogLevel!
}

type SatisfactoryApiStatus {
  running: Boolean!
  pingMs: Int!
}

"""
ConnectivityReason explains why a session is unreachable, so the UI can say more
than "offline".
"""
enum ConnectivityReason {
  "The session is reachable."
  NONE
  "Nothing answered: timed out or refused. FRM is most likely not running."
  NO_RESPONSE
  "Something answered but it was not FRM: an HTTP error, TLS failure, or a body that does not parse."
  BAD_RESPONSE
}

"""
ConnectionState is the authoritative connection state for a session, so clients
never derive one from a pair of booleans.
"""
enum ConnectionState {
  "A poller is running but FRM has not answered yet."
  CONNECTING
  "FRM answered."
  ONLINE
  "FRM could not be reached; reason says why."
  OFFLINE
  "FRM answered but has a save loaded other than the one this session is pinned to."
  SAVE_MISMATCH
}

type ConnectivityStatus {
  connectionState: ConnectionState!
  stage: SessionStage!
  reason: ConnectivityReason!
  "The save the server has loaded instead. Non-null exactly when connectionState is SAVE_MISMATCH."
  mismatchedSaveName: String
}

"""
AuthStatus is the only unguarded query, so it is the single source of truth for
what the client should show before it can read anything else.
"""
type AuthStatus {
  "False until first-run setup completes. The client must route to setup."
  initialized: Boolean!
  "False on an open instance, where no access key is needed."
  authRequired: Boolean!
  "Whether this caller may read guarded fields. Always true on an open instance."
  authenticated: Boolean!
}

# ============================================================================
# History — one concrete typed point per data type (decision D-C)
# ============================================================================

enum HistoryDataType {
  CIRCUITS
  FACTORY_STATS
  PROD_STATS
  GENERATOR_STATS
  SINK_STATS
}

type CircuitsHistoryPoint {
  gameTimeId: Int!
