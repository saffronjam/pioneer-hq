}

type FactoryStatsHistoryPoint {
  gameTimeId: Int!
  factoryStats: FactoryStats!
}

type ProdStatsHistoryPoint {
  gameTimeId: Int!
  prodStats: ProdStats!
}

type GeneratorStatsHistoryPoint {
  gameTimeId: Int!
  generatorStats: GeneratorStats!
}

type SinkStatsHistoryPoint {
  gameTimeId: Int!
  sinkStats: SinkStats!
}

# ============================================================================
# Inputs / mutation results
# ============================================================================

input LoginInput {
  password: String!
}

"""
CompleteSetupInput claims an unset-up instance. Omitting password leaves the
instance open, requiring no access key.
"""
input CompleteSetupInput {
  setupToken: String!
  password: String
}

input EnableAuthInput {
  password: String!
}

input DisableAuthInput {
  currentPassword: String!
}

input ChangePasswordInput {
  currentPassword: String!
  newPassword: String!
}

input CreateSessionInput {
  name: String!
  address: String!
  """
  The save the client saw when it probed the address. The server re-probes and
  rejects the mutation if the server has since loaded a different save, so a
  session can never be pinned to a save nobody confirmed.
  """
  expectedSaveName: String!
}

input UpdateSessionInput {
  name: String
  isPaused: Boolean
  address: String
}

input UpdateSettingsInput {
  logLevel: LogLevel!
}

type LoginResult {
  success: Boolean!
  message: String!
}

type LogoutResult {
  success: Boolean!
}

type SetupResult {
  success: Boolean!
  message: String!
}

type ChangePasswordResult {
  success: Boolean!
  message: String!
}

