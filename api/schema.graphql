  generated: Boolean!
  fixedSupply: Boolean!
  surplus: Boolean!
  disabledOutputs: [ID!]!
  settings: PlannerSettings!
  builtFingerprint: String!
}

input PlannerNodeInput {
  inputRateMode: String!
  outputRateMode: String!
  exposed: Boolean!
  id: ID!
  kind: String!
  parentId: ID!
  name: String!
  itemId: ID!
  recipeId: ID!
  machineId: ID!
  linkedDiagramId: ID!
  x: Float!
  y: Float!
  width: Float!
  height: Float!
  collapsed: Boolean!
  rate: Float!
  clock: Float!
  somersloops: Int!
